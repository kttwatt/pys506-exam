<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PYS506 Flashcards</title>
<style>
  :root {
    --bg: #0f1419;
    --accent: #4aa3ff;
    --card-bg: #1a2029;
    --card-bg-2: #212836;
    --text: #e8edf3;
    --text-dim: #8b98a9;
    --border: #2a3441;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "TH Sarabun New", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    gap: 20px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .progress-wrap {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .progress-text {
    font-size: 0.95rem;
    color: var(--text-dim);
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #6fc3ff);
    border-radius: 4px;
    transition: width 0.25s ease;
  }
  .card-scene {
    width: 100%;
    max-width: 640px;
    height: 380px;
    perspective: 1600px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 30px;
    border-radius: 20px;
    backface-visibility: hidden;
    background: linear-gradient(150deg, var(--card-bg), var(--card-bg-2));
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow-y: auto;
  }
  .card-face::-webkit-scrollbar { width: 6px; }
  .card-face::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .card-face.front {
    z-index: 2;
  }
  .card-face.back {
    transform: rotateY(180deg);
    border-color: rgba(74,163,255,0.35);
  }
  .face-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  .face-label.back-label { color: var(--accent); }
  .card-text {
    font-size: 1.35rem;
    line-height: 1.6;
    text-align: center;
    font-weight: 500;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 12px;
  }
  .card-face.back .card-text {
    font-size: 1.15rem;
    font-weight: 400;
    color: #d7e6fb;
  }
  .card-text b { color: var(--accent); font-weight: 700; }
  .hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.78rem;
    color: var(--text-dim);
    opacity: 0.7;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  button {
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover {
    background: #262f3d;
    border-color: var(--accent);
  }
  button:active {
    transform: scale(0.96);
  }
  button.primary {
    background: var(--accent);
    color: #06131f;
    font-weight: 600;
    border-color: var(--accent);
  }
  button.primary:hover {
    background: #6fc3ff;
  }
  .shuffle-active {
    color: var(--accent);
    border-color: var(--accent);
  }
  .footer-note {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    max-width: 640px;
    opacity: 0.75;
  }
  @media (max-width: 480px) {
    .card-scene { height: 420px; }
    .card-text { font-size: 1.1rem; }
    button { padding: 10px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<h1>🩺 PYS506 Flashcards — สรุปทุกบทก่อนสอบ</h1>

<div class="progress-wrap">
  <div class="progress-text" id="progressText">การ์ด 1/206</div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
</div>

<div class="card-scene">
  <div class="card" id="card">
    <div class="card-face front">
      <span class="face-label">คำถาม</span>
      <div class="card-text" id="frontText"></div>
      <span class="hint">คลิกเพื่อดูคำตอบ</span>
    </div>
    <div class="card-face back">
      <span class="face-label back-label">คำตอบ</span>
      <div class="card-text" id="backText"></div>
      <span class="hint">คลิกเพื่อกลับด้าน</span>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">⟵ ก่อนหน้า</button>
  <button id="flipBtn" class="primary">🔄 พลิกการ์ด</button>
  <button id="nextBtn">ถัดไป ⟶</button>
  <button id="shuffleBtn">🔀 สับการ์ด</button>
</div>

<div class="footer-note">
  คีย์บอร์ด: ← ก่อนหน้า · → ถัดไป · Space/Enter พลิกการ์ด
</div>

: "Hypothyroid", "b": "TSH", "t": "สรุปpys506-exam-all-topics"}, {"f": "Obesity", "b": "ALT (+ BMI Z-score ตามเพศ/อายุ)", "t": "สรุปpys506-exam-all-topics"}, {"f": "Morbid obesity", "b": "CBC, CXR, BS, ALT, ±EKG, ±Echocardiogram", "t": "สรุปpys506-exam-all-topics"}, {"f": "เสี่ยงเสียเลือดมาก (>10%BV หรือ >7 mL/kg)", "b": "CBC, ±PT, ±APTT (ไม่แนะนำ routine coagulation test)", "t": "สรุปpys506-exam-all-topics"}, {"f": "สงสัย Mediastinal mass", "b": "CXR", "t": "สรุปpys506-exam-all-topics"}, {"f": "สงสัยตั้งครรภ์", "b": "Urine pregnancy test (UPT)", "t": "สรุปpys506-exam-all-topics"}, {"f": "Malnutrition", "b": "Albumin", "t": "สรุปpys506-exam-all-topics"}, {"f": "ยา Anticonvulsants", "b": "±ALT", "t": "สรุปpys506-exam-all-topics"}, {"f": "ยา Diuretics", "b": "BUN, Creatinine, Electrolytes", "t": "สรุปpys506-exam-all-topics"}, {"f": "ยา Digoxin", "b": "Electrolytes", "t": "สรุปpys506-exam-all-topics"}, {"f": "ยา Anticoagulants", "b": "CBC, PT-INR, APTT ratio", "t": "สรุปpys506-exam-all-topics"}];

let order = CARDS.map((_, i) => i);
let pos = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderMarkdownBold(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function render() {
  const card = CARDS[order[pos]];
  frontText.innerHTML = renderMarkdownBold(card.f);
  backText.innerHTML = renderMarkdownBold(card.b);
  progressText.textContent = `การ์ด ${pos + 1}/${CARDS.length}`;
  progressFill.style.width = `${((pos + 1) / CARDS.length) * 100}%`;
  if (flipped) {
    cardEl.classList.add('flipped');
  } else {
    cardEl.classList.remove('flipped');
  }
}

function goNext() {
  pos = (pos + 1) % CARDS.length;
  flipped = false;
  render();
}

function goPrev() {
  pos = (pos - 1 + CARDS.length) % CARDS.length;
  flipped = false;
  render();
}

function toggleFlip() {
  flipped = !flipped;
  render();
}

function shuffleCards() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
}

cardEl.addEventListener('click', toggleFlip);
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
flipBtn.addEventListener('click', toggleFlip);
shuffleBtn.addEventListener('click', shuffleCards);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goPrev();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    goNext();
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleFlip();
  }
});

render();
</script>
